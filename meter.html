<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポコチャ メーター＆アイテム計算機</title>
  <style>
    :root {
      --primary-color: #ff4081;
      --secondary-color: #ff80ab;
      --bg-color: #fff5f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #7c4dff;
    }

    * {
      box-sizing: border-box;
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(255, 64, 129, 0.15);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    .ref-link {
      display: block;
      text-align: center;
      background-color: #ffe0b2;
      color: #e65100;
      padding: 8px 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 20px;
      transition: transform 0.1s;
    }

    .ref-link:active {
      transform: scale(0.98);
    }

    .input-group {
      margin-bottom: 16px;
      background: #fef0f5;
      padding: 12px;
      border-radius: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--primary-color);
      font-size: 0.95rem;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    input[type="number"] {
      flex: 1;
      border: 2px solid var(--secondary-color);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 1.1rem;
      font-weight: bold;
      outline: none;
      width: 100%;
    }

    input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .btn-k {
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #512da8;
    }

    .btn-k:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #512da8;
    }

    /* 視覚的メーター表示 */
    .meter-visual-zone {
      margin: 20px 0;
      background: #fff;
      border: 2px dashed var(--secondary-color);
      padding: 12px;
      border-radius: 16px;
    }

    .meter-bar-container {
      background-color: #e0e0e0;
      height: 24px;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 8px;
      position: relative;
    }

    .meter-bar-fill {
      background: linear-gradient(90deg, #ff80ab, #ff4081);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 計算結果カード */
    .result-card {
      background: linear-gradient(135deg, #ff4081, #7c4dff);
      color: white;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .result-title {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 4px 0;
    }

    .result-sub {
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 8px;
      border-radius: 8px;
      display: inline-block;
    }

    /* アイテム一覧 */
    .item-section-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 12px;
      text-align: center;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .item-card {
      background: #f9f9f9;
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .item-name {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .item-cost {
      font-size: 0.75rem;
      color: #777;
      margin-bottom: 6px;
    }

    .item-count {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .item-count span {
      font-size: 0.8rem;
      color: #333;
    }

    /* 自由入力アイテムカード */
    .custom-item-card {
      grid-column: span 2;
      background: #f0f4ff;
      border: 2px solid #9fa8da;
      border-radius: 12px;
      padding: 12px;
    }

    .custom-input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .custom-input-row input {
      width: 100px;
      padding: 4px 8px;
      font-size: 0.9rem;
      text-align: center;
    }

    /* フッター・PRエリア */
    .footer-area {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 2px dashed #f0f0f0;
      text-align: center;
    }

    .author-credit {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 12px;
    }

    .agency-btn {
      display: inline-block;
      background: linear-gradient(135deg, #7c4dff, #ff4081);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 10px 20px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(124, 77, 255, 0.2);
      transition: transform 0.2s, opacity 0.2s;
      margin-bottom: 20px;
    }

    .agency-btn:active {
      transform: scale(0.96);
    }

    .video-section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #666;
      margin-bottom: 12px;
    }

    .video-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-card {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 アスペクト比 */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .video-card iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>✨ メーター＆コイン計算機 ✨</h1>

  <!-- 外部参考リンク -->
  <a href="https://one-carat.com/campus/archives/category/streamer-tips/pococha-rank-border" target="_blank" rel="noopener noreferrer" class="ref-link">
    🔍 今日のボーダー（参考値）をチェック
  </a>

  <!-- 入力フォーム -->
  <div class="input-group">
    <label for="targetMeter">① 目標メーター</label>
    <div class="input-wrapper">
      <input type="number" id="targetMeter" placeholder="例: 100000" oninput="calculate()">
      <button class="btn-k" onclick="addK('targetMeter')">k</button>
    </div>
  </div>

  <div class="input-group">
    <label for="currentMeter">② 今のメーター</label>
    <div class="input-wrapper">
      <input type="number" id="currentMeter" placeholder="例: 20000" oninput="calculate()">
      <button class="btn-k" onclick="addK('currentMeter')">k</button>
    </div>
  </div>

  <!-- 視覚的メーター -->
  <div class="meter-visual-zone">
    <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: bold;">
      <span>進捗率</span>
      <span id="progressText">0%</span>
    </div>
    <div class="meter-bar-container">
      <div class="meter-bar-fill" id="meterBar"></div>
    </div>
  </div>

  <!-- 計算結果表示 -->
  <div class="result-card">
    <div class="result-title">③ 必要なメーター</div>
    <div class="result-value" id="neededMeter">0</div>
    <div class="result-sub" id="neededMeterK">（0k）</div>

    <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.3); margin: 12px 0;">

    <div class="result-title">④ 必要なコイン数（メーター÷4）</div>
    <div class="result-value" id="neededCoins" style="color: #ffe082;">0</div>
  </div>

  <!-- 必要なアイテム一覧 -->
  <div class="item-section-title">🎁 あと必要なアイテム数</div>
  <div class="item-grid">
    <div class="item-card">
      <div class="item-name">馬車</div>
      <div class="item-cost">5,555 コイン</div>
      <div class="item-count" id="count-5555">0 <span>個</span></div>
    </div>

    <div class="item-card">
      <div class="item-name">花火</div>
      <div class="item-cost">1,080 コイン</div>
      <div class="item-count" id="count-1080">0 <span>個</span></div>
    </div>

    <div class="item-card">
      <div class="item-name">トライバル</div>
      <div class="item-cost">444 コイン</div>
      <div class="item-count" id="count-444">0 <span>個</span></div>
    </div>

    <div class="item-card">
      <div class="item-name">シマエナガ</div>
      <div class="item-cost">111 コイン</div>
      <div class="item-count" id="count-111-1">0 <span>個</span></div>
    </div>

    <div class="item-card">
      <div class="item-name">笹の葉パンダ</div>
      <div class="item-cost">111 コイン</div>
      <div class="item-count" id="count-111-2">0 <span>個</span></div>
    </div>

    <div class="item-card">
      <div class="item-name">はしゃぐ</div>
      <div class="item-cost">33 コイン</div>
      <div class="item-count" id="count-33">0 <span>個</span></div>
    </div>

    <div class="item-card" style="grid-column: span 2;">
      <div class="item-name">ハート</div>
      <div class="item-cost">1 コイン</div>
      <div class="item-count" id="count-1">0 <span>個</span></div>
    </div>

    <!-- 自由入力アイテム -->
    <div class="custom-item-card">
      <div class="custom-input-row">
        <span style="font-weight: bold; font-size: 0.85rem;">自由入力:</span>
        <input type="number" id="customCoin" placeholder="コイン数" oninput="calculate()">
        <span style="font-size: 0.85rem;">コイン</span>
      </div>
      <div class="item-count" id="count-custom">0 <span>個</span></div>
    </div>
  </div>

  <!-- フッター・クレジット・事務所PRエリア -->
  <div class="footer-area">
    <div class="author-credit">作成: pococha配信事務所なかなか</div>
    <a href="https://v0-landing-page-design-six-drab.vercel.app/" target="_blank" rel="noopener noreferrer" class="agency-btn">
      🏠 事務所公式ホームページはこちら
    </a>

    <div class="video-section-title">🎬 ライバー紹介・おすすめ動画</div>
    <div class="video-container">
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/wB40iEou6mI" title="ライバー紹介動画1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="video-card">
        <iframe src="https://www.youtube.com/embed/1qX5vc1tAvo" title="ライバー紹介動画2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <!-- 今後動画を追加する場合はここへ <div class="video-card"><iframe ...></iframe></div> を増やせます -->
    </div>
  </div>

</div>

<script>
  // kボタンを押したときの動作（数字に1000を掛ける）
  function addK(inputId) {
    const input = document.getElementById(inputId);
    let val = parseFloat(input.value);
    if (!isNaN(val)) {
      input.value = Math.floor(val * 1000);
      calculate();
    }
  }

  // 数字をカンマ区切りにする
  function formatNum(num) {
    return num.toLocaleString();
  }

  // メイン計算処理
  function calculate() {
    const target = parseFloat(document.getElementById('targetMeter').value) || 0;
    const current = parseFloat(document.getElementById('currentMeter').value) || 0;

    // ③ 必要なメーター（0未満にならないようにする）
    let neededMeterVal = target - current;
    if (neededMeterVal < 0) neededMeterVal = 0;

    // k換算表記（例: 20k）
    const kVal = (neededMeterVal / 1000).toFixed(1).replace(/\.0$/, '');

    // 画面表示更新
    document.getElementById('neededMeter').textContent = formatNum(neededMeterVal);
    document.getElementById('neededMeterK').textContent = `（${kVal}k）`;

    // ④ 必要なコイン数（メーター ÷ 4）
    const neededCoinsVal = Math.ceil(neededMeterVal / 4);
    document.getElementById('neededCoins').textContent = `${formatNum(neededCoinsVal)} コイン`;

    // 視覚的メーター（プログレスバー）の更新
    let percentage = 0;
    if (target > 0) {
      percentage = Math.min(Math.round((current / target) * 100), 100);
    }
    document.getElementById('meterBar').style.width = percentage + '%';
    document.getElementById('progressText').textContent = percentage + '%';

    // ⑤ 各アイテムの必要個数計算（切り上げ：Math.ceil）
    const items = [
      { id: 'count-5555', cost: 5555 },
      { id: 'count-1080', cost: 1080 },
      { id: 'count-444', cost: 444 },
      { id: 'count-111-1', cost: 111 },
      { id: 'count-111-2', cost: 111 },
      { id: 'count-33', cost: 33 },
      { id: 'count-1', cost: 1 }
    ];

    items.forEach(item => {
      const count = neededCoinsVal > 0 ? Math.ceil(neededCoinsVal / item.cost) : 0;
      document.getElementById(item.id).innerHTML = `${formatNum(count)} <span>個</span>`;
    });

    // 自由入力アイテムの計算
    const customCost = parseFloat(document.getElementById('customCoin').value) || 0;
    if (customCost > 0 && neededCoinsVal > 0) {
      const customCount = Math.ceil(neededCoinsVal / customCost);
      document.getElementById('count-custom').innerHTML = `${formatNum(customCount)} <span>個</span>`;
    } else {
      document.getElementById('count-custom').innerHTML = `0 <span>個</span>`;
    }
  }
</script>

</body>
</html>
